# Objective AI-slop markers only (no emoji hard-blocks).
# Design gate matches these as literal substrings in changed files (forbidden_calls).
# Attribution constraint ids containing "ai-generated" also scan comments/strings.
constraints:
  - id: no-ai-generated-markers
    keywords: []
    forbidden_calls:
      - "Generated by AI"
      - "AI-generated"
      - "AI generated"
      - "Generated by ChatGPT"
      - "Generated by Copilot"
      - "Generated by Claude"
      - "Generated by Gemini"
      - "Generated by Codex"
      - "Generated-by:"
      - "Auto-generated by"
      - "as an AI language model"
      - "YOUR_CODE_HERE"
      - "INSERT_YOUR_CODE"
    required_calls: []
