<text x="830.0" y="155" text-anchor="middle" font-size="12" fill="#475569">phase sensor</text>
<line x1="830" y1="175" x2="830" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="960" y="105" width="200" height="70" rx="12" fill="#E8F1FF" stroke="#93C5FD" stroke-width="1.5"/>
<text x="1060.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">Policy engine</text>
<text x="1060.0" y="155" text-anchor="middle" font-size="12" fill="#475569">facts / verdict</text>
<line x1="1060" y1="175" x2="1060" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="220" width="1120" height="95" rx="12" fill="#DFF7F2" stroke="#5EEAD4" stroke-width="1.5"/>
<text x="56" y="247" text-anchor="start" font-size="15" font-weight="700" fill="#0B132B">Trust boundary</text>
<text x="56" y="270" text-anchor="start" font-size="12" fill="#475569">Resolve config once | compare complete .aiv tree | reject ignored extras and symlinks</text>
<text x="56" y="288" text-anchor="start" font-size="12" fill="#475569">Materialize immutable policy snapshot from trusted Git blobs | bind request + config + sidecars + commit</text>
<line x1="600" y1="315" x2="600" y2="350" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="355" width="1120" height="190" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="56" y="382" text-anchor="start" font-size="15" font-weight="700" fill="#0B132B">Deterministic verdict engine</text>
<text x="56" y="405" text-anchor="start" font-size="12" fill="#475569">Hard evidence: syntax | invariant | dependency | package existence | test adequacy | security | design</text>
<text x="56" y="423" text-anchor="start" font-size="12" fill="#475569">Review evidence: density | cohesion | duplication | documentation | PR metadata | license header</text>
<text x="56" y="441" text-anchor="start" font-size="12" fill="#475569">Extension surfaces: generic YAML rules | trusted external SARIF | optional advisory Jev questions</text>
<text x="56" y="459" text-anchor="start" font-size="12" fill="#475569">Core policy: severity | fail-fast | baselines | inline suppressions | signed allow-listed skip</text>
