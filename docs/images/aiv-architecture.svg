<text x="140.0" y="132" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">Developer</text>
<text x="140.0" y="155" text-anchor="middle" font-size="12" fill="#475569">pre-commit</text>
<line x1="140" y1="175" x2="140" y2="215" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
