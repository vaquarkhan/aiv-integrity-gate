<text x="600.0" y="635" text-anchor="middle" font-size="12" fill="#475569">labels / comments</text>
<line x1="830" y1="545" x2="830" y2="580" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="730" y="585" width="200" height="70" rx="12" fill="#FFF4D6" stroke="#F59E0B" stroke-width="1.5"/>
<text x="830.0" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">Audit chain</text>
<text x="830.0" y="635" text-anchor="middle" font-size="12" fill="#475569">locked append</text>
<line x1="1060" y1="545" x2="1060" y2="580" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="960" y="585" width="200" height="70" rx="12" fill="#FFF4D6" stroke="#F59E0B" stroke-width="1.5"/>
<text x="1060.0" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">HTML / JSONL</text>
<text x="1060.0" y="635" text-anchor="middle" font-size="12" fill="#475569">calibration / query</text>
