<rect x="270" y="585" width="200" height="70" rx="12" fill="#FFF4D6" stroke="#F59E0B" stroke-width="1.5"/>
<text x="370.0" y="612" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">SARIF / Checks</text>
<text x="370.0" y="635" text-anchor="middle" font-size="12" fill="#475569">severity preserved</text>
<line x1="600" y1="545" x2="600" y2="580" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="500" y="585" width="200" height="70" rx="12" fill="#FFF4D6" stroke="#F59E0B" stroke-width="1.5"/>
