<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0B132B">AIV Integrity Gate architecture</text>
<text x="40" y="76" font-size="15" fill="#475569">One evidence engine, frozen policy, multiple delivery surfaces</text>
