<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">Where AIV Integrity Gate runs</title>
  <desc id="desc">Pre-commit hook, then GitHub Action CI backstop, then merge only if hard gates pass</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F0FDFA"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1120" height="420" fill="url(#bg)"/>
  <text x="56" y="48" fill="#0B1F3A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700">Where AIV runs</text>
  <text x="56" y="78" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15">Same hard rules at commit time and in CI  shift left, keep the backstop.</text>

  <!-- Arrow connectors -->
  <path d="M340 220 H400" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <polygon points="400,212 418,220 400,228" fill="#94A3B8"/>
  <path d="M700 220 H760" stroke="#94A3B8" stroke-width="3" fill="none"/>
  <polygon points="760,212 778,220 760,228" fill="#94A3B8"/>

  <g filter="url(#shadow)">
    <rect x="56" y="120" width="284" height="200" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="56" y="120" width="284" height="10" rx="5" fill="#0F766E"/>
    <text x="80" y="168" fill="#0F766E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">1 · LOCAL COMMIT</text>
    <text x="80" y="208" fill="#0B1F3A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">pre-commit hook</text>
    <text x="80" y="240" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Staged diff only · seconds</text>
    <text x="80" y="280" fill="#0F766E" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-style="italic">shift-left (recommended)</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="418" y="120" width="284" height="200" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="418" y="120" width="284" height="10" rx="5" fill="#1D4ED8"/>
    <text x="442" y="168" fill="#1D4ED8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">2 · PULL REQUEST</text>
    <text x="442" y="208" fill="#0B1F3A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">GitHub Action</text>
    <text x="442" y="240" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Composite action / JAR · CI backstop</text>
    <text x="442" y="280" fill="#1D4ED8" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-style="italic">same rules as local</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="780" y="120" width="284" height="200" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <rect x="780" y="120" width="284" height="10" rx="5" fill="#059669"/>
    <text x="804" y="168" fill="#059669" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1">3 · MERGE</text>
    <text x="804" y="208" fill="#0B1F3A" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">hard gates pass</text>
    <text x="804" y="240" fill="#475569" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Then optional advisory review</text>
    <text x="804" y="280" fill="#059669" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-style="italic">block merge on FAIL</text>
  </g>

  <text x="56" y="380" fill="#64748B" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">AIV = Automated Integrity Validation · air-gapped · diff-scoped · precision-first</text>
</svg>
