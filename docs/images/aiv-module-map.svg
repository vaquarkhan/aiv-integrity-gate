<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" font-family="Segoe UI,Arial,sans-serif">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="#475569"/></marker></defs>
<rect width="1200" height="700" fill="#FFFFFF"/>
<text x="40" y="48" font-size="28" font-weight="700" fill="#0B132B">AIV module dependency map</text>
