<text x="600.0" y="293" text-anchor="middle" font-size="12" fill="#475569">package-existence | test-adequacy | security</text>
<text x="600.0" y="311" text-anchor="middle" font-size="12" fill="#475569">design (+ cohesion) | density | duplication</text>
<text x="600.0" y="329" text-anchor="middle" font-size="12" fill="#475569">doc-integrity | pr-metadata | license-header</text>
<text x="600.0" y="347" text-anchor="middle" font-size="12" fill="#475569">external | rules | jev</text>
