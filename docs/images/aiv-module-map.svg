<rect x="40" y="225" width="250" height="170" rx="12" fill="#DFF7F2" stroke="#CBD5E1" stroke-width="1.5"/>
<text x="165.0" y="252" text-anchor="middle" font-size="15" font-weight="700" fill="#0B132B">Kernel</text>
<text x="165.0" y="275" text-anchor="middle" font-size="12" fill="#475569">aiv-api</text>
<text x="165.0" y="293" text-anchor="middle" font-size="12" fill="#475569">aiv-core</text>
<rect x="315" y="225" width="570" height="260" rx="12" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
