# Design constraints - forbidden and required patterns
# Note: System.exit is allowed in CLI main() - not forbidden for this project
# Prefer objective AI attribution markers. Avoid emoji hard-blocks (false positives on legitimate code).
constraints:
  # AI slop: attribution markers left behind in generated code.
  - id: no-ai-generated-markers
    keywords: []
    forbidden_calls:
      - "Generated by AI"
      - "AI-generated"
      - "AI generated"
      - "Generated by ChatGPT"
      - "Generated by Copilot"
      - "Generated by Claude"
      - "Generated by Gemini"
      - "Auto-generated by"
      - "as an AI language model"
      - "TODO: AI"
    required_calls: []

  # Example architecture rule: prefer ExpireSnapshots API.
  - id: snapshot-expiration
    keywords: [ExpireSnapshots, expireSnapshots]
    forbidden_calls: [table.removeSnapshots]
    required_calls: [ExpireSnapshots]
