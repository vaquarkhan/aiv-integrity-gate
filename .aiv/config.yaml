schema_version: 1
# AIV config - tuned for this repository baseline (dogfood).
# Exclude docs and example project from code-focused gates.
exclude_paths:
  - "docs/**"
  - "example-project/**"
  - "benchmarks/**"
# Run all gates and aggregate failures (set true to stop at first failure)
fail_fast: false
# When severity=warn gates find AI-slop signals, optional PR label (CLI --label-pr-on-advisory)
advisory_pr_label: aiv:advisory
advisory_label_gates:
  - design
  - invariant
  - density
  - cohesion
  - duplication
  - test-adequacy
# /aiv skip is default-deny: with no allowlist the directive is ignored. When set, the head commit
# must also carry a GOOD signature (%G? == G). Author email alone is never trusted.
# skip_allowlist:
#   - maintainer@example.com
gates:
  # ---- Hard gates: objective, deterministic, reproducible defects on the diff ----
  - id: syntax
    enabled: true
  - id: invariant
    enabled: true
  - id: dependency
    enabled: true
    config:
      # Root pom does not list every module dependency; JavaParser is declared in aiv-plugin-design only.
      whitelist:
        - com.github.javaparser
        - com.github.javaparser.ast
        - com.github.javaparser.ast.comments
        - com.github.javaparser.ast.expr
        - com.github.javaparser.ast.body
        - com.github.javaparser.ast.visitor
  - id: package-existence
    enabled: true
  - id: security
    enabled: true
  - id: test-adequacy
    enabled: true
  - id: design
    enabled: true
    config:
      rules_path: .aiv/design-rules.yaml
  # ---- Soft signals: advisory, never the sole merge block ----
  - id: density
    enabled: true
    severity: warn
    config:
      ldr_threshold: 0.25
      entropy_threshold: 4.0
      refactor_net_loc_threshold: -50
  - id: cohesion
    enabled: true
    severity: warn
    config:
      max_areas: 4
      area_depth: 2
      max_files: 0
  - id: duplication
    enabled: true
    severity: warn
  - id: doc-integrity
    enabled: false
    config:
      rules_path: .aiv/doc-rules.yaml
      auto: true
